name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run CPU unit and integration tests
        run: >-
          PYTHONPATH=. python -m pytest -q
          -m "(unit or integration) and not cuda and not triton and not benchmark"

      - name: Compile tracked Python sources
        run: bash scripts/compile_python.sh

      - name: Check types
        run: python -m pyright

      - name: Check lint
        run: ruff check . --select E4,E7,E9,F
